name: Actualizar partidos Rivas Futsal

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-partidos-rivas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar automatización
        working-directory: automation
        run: |
          npm install --package-lock=false
          npx playwright install chromium --with-deps

      - name: Obtener partidos
        working-directory: automation
        run: |
          node actualizar-partidos.mjs

      - name: Guardar partidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/partidos.json

          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi

          git commit -m "Actualizar partidos"
          git push
