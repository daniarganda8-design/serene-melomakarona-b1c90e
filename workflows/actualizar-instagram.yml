name: Actualizar noticias Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-instagram-rivas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Obtener publicaciones de Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node automation/actualizar-instagram.mjs

      - name: Guardar actualización temporal
        run: |
          mkdir -p /tmp/instagram-update/assets/data
          mkdir -p /tmp/instagram-update/assets/images
          cp assets/data/noticias.json /tmp/instagram-update/assets/data/noticias.json
          if [ -d assets/images/instagram ]; then
            cp -R assets/images/instagram /tmp/instagram-update/assets/images/instagram
          fi

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5
          do
            echo "Intento $intento de publicar noticias..."

            git fetch origin main
            git checkout -B main origin/main

            mkdir -p assets/data assets/images
            rm -rf assets/images/instagram
            cp /tmp/instagram-update/assets/data/noticias.json assets/data/noticias.json
            if [ -d /tmp/instagram-update/assets/images/instagram ]; then
              cp -R /tmp/instagram-update/assets/images/instagram assets/images/instagram
            fi

            git add assets/data/noticias.json assets/images/instagram

            if git diff --cached --quiet; then
              echo "No hay publicaciones nuevas que publicar."
              exit 0
            fi

            git commit -m "Actualizar noticias de Instagram"

            if git push origin main; then
              echo "Noticias de Instagram publicadas correctamente."
              exit 0
            fi

            echo "La rama cambió mientras se publicaba. Reintentando..."
            sleep 3
          done

          echo "No se pudo publicar después de 5 intentos."
          exit 1
