name: Actualizar partidos Rivas Futsal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-partidos-rivas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        working-directory: automation
        run: |
          npm install --package-lock=false
          npx playwright install chromium --with-deps

      - name: Obtener partidos
        working-directory: automation
        run: |
          node actualizar-partidos.mjs

      - name: Guardar JSON temporalmente
        run: |
          cp assets/data/partidos.json /tmp/partidos.json

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for intento in 1 2 3 4 5
          do
            echo "Intento $intento de guardar los partidos..."

            git fetch origin main
            git checkout -B main origin/main

            mkdir -p assets/data
            cp /tmp/partidos.json assets/data/partidos.json

            git add assets/data/partidos.json

            if git diff --cached --quiet; then
              echo "Los partidos no han cambiado."
              exit 0
            fi

            git commit -m "Actualizar partidos Rivas Futsal"

            if git push origin main; then
              echo "Partidos publicados correctamente."
              exit 0
            fi

            echo "La rama cambió mientras se publicaba. Reintentando..."
            sleep 3
          done

          echo "No se pudo publicar después de 5 intentos."
          exit 1
